<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">

        <title>Impostor de Duplas</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">

            <!-- TELA DE CONFIGURAÇÃO -->

            <div id="telaInicial">

                <h1>Impostor de Duplas</h1>

                <h2 id="tituloJogadores">
                    Jogadores (0/6)
                </h2>

                <div id="listaJogadores">

                </div>

                <p id="avisoJogadores"> 
                    Mínimo: 5 jogadores
                </p>

                <button id="adicionarJogador">
                    + Adicionar jogador
                </button>

                <br><br>

                <div id="seletorTempo">

                    <h2>Tempo da partida</h2>

                    <h1 id="tempoSelecionado">
                        05:00
                    </h1>

                    <div class="botoesTempo">

                        <button id="menos10">
                            -10
                        </button>

                        <button id="menos30">
                            -30
                        </button>

                        <button id="menos60">
                            -1:00
                        </button>

                    </div>

                    <div class="botoesTempo">

                        <button id="mais10">
                            +10
                        </button>

                        <button id="mais30">
                            +30
                        </button>

                        <button id="mais60">
                            +1:00
                        </button>

                    </div>

                </div>
          
                </select>

                <button id="comecarJogo">
                    Começar jogo
                </button>

            </div>

            <!-- TELA DO JOGO -->
            <div id="telaJogo" style="display: none;">

                <h1 id="nomeJogador">

                    É a vez de...

                </h1>

                <button id="mostrarPalavra">
                    Mostrar minha palavra
                </button>

                <div id="palavraSecreta" style="display: none;">

                    <h2 id="tipoJogador"></h2>

                    <h1 id="palavraJogador"></h1>

                    <button id="esconderPalavra">
                        Esconder e passar
                    </button>

                </div>

                <div class="botoesInferiores">
                    <button id="reiniciarPartida">

                        Reiniciar Partida

                    </button>

                    <button id="sairPartida">
                        
                        Sair da partida

                    </button>
                </div>


            </div>

            <div id="telaFinal" style="display: none;">

                <h1>Todos receberam seus papéis!</h1>

                <h2 id="jogadorInicial">Jogador Inicial: </h2>

                <h1 id="timerPartida"></h1>

                <h2 id="mensagemFim"></h2>

                <p id="mensagemDeInicio">
                    Agora conversem e tentem descobrir quem é a sua dupla.
                </p>

                <h2 id="boaSorte">Boa sorte!</h2>

                <button id="novoJogo">
                    Novo jogo
                </button>

            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
